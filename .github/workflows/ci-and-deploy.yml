name: CI & Optional Server Auto-Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, Unit Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@12.21.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run strict typecheck
        run: pnpm typecheck

      - name: Run unit & PostgreSQL integration tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

  deploy:
    name: Auto-Deploy to Custom Server (if Secrets configured)
    needs: verify
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Check deployment secrets and deploy via SSH
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "未配置 DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY，跳过自动服务器部署（仅执行 CI 验证）。"
            exit 0
          fi

          PORT="${DEPLOY_PORT:-22}"
          TARGET_DIR="${DEPLOY_PATH:-/opt/omnikit-ai}"

          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_deploy -p "$PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" "
            set -e
            if [ ! -d '${TARGET_DIR}/.git' ]; then
              echo '目标目录 ${TARGET_DIR} 尚未克隆仓库，请先在服务器上首次 git clone 后再由 Actions 自动更新。'
              exit 1
            fi
            cd '${TARGET_DIR}'
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
          "
